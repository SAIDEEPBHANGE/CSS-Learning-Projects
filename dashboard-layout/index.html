<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="dashboard">
      <aside class="sidebar">
        <div class="sidebar__logo">Logo</div>
        <nav class="sidebar__nav">
          <ul class="nav-list">
            <li class="nav-list__item active">Dashboard</li>
            <li class="nav-list__item">Analytics</li>
            <li class="nav-list__item">Projects</li>
            <li class="nav-list__item">Settings</li>
          </ul>
        </nav>
      </aside>
      <div class="dashboard__content">
        <header class="topbar">
          <div class="topbar__search">Search</div>
          <div class="topbar__actions">Notifications Profile</div>
        </header>
        <section class="stats">
          <article class="stat-card">
            <h3 class="stat-card__title">Revenue</h3>
            <p class="stat-card__value">$12,500</p>
          </article>
          <article class="stat-card">
            <h3 class="stat-card__title">Users</h3>
            <p class="stat-card__value">2,350</p>
          </article>
          <article class="stat-card">
            <h3 class="stat-card__title">Orders</h3>
            <p class="stat-card__value">820</p>
          </article>
          <article class="stat-card">
            <h3 class="stat-card__title">Growth</h3>
            <p class="stat-card__value">18%</p>
          </article>
        </section>
        <main class="main-content">
          <section class="content-section">Main Dashboard Content</section>
          <section class="content-section">Additional Widgets</section>
        </main>
      </div>
    </div>
  </body>
</html>
